services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: dawn-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dawn_lms}
      POSTGRES_USER: ${POSTGRES_USER:-dawn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dawn_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - dawn-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dawn_user} -d ${POSTGRES_DB:-dawn_lms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: dawn-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-dawn_redis_pass}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - dawn-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Go Backend API
  backend:
    build:
      context: ./backend/dawn-lms
      dockerfile: Dockerfile
    container_name: dawn-backend
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-dawn_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dawn_password}
      DB_NAME: ${POSTGRES_DB:-dawn_lms}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      GIN_MODE: release
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - dawn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: ["/app/main"] # Default command

  # New service definition for running the seeder
  backend-seeder:
    build:
      context: ./backend/dawn-lms
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-dawn_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-dawn_password}
      DB_NAME: ${POSTGRES_DB:-dawn_lms}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dawn-network
    command: ["/app/main", "--seed"]

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
        - GOOGLE_API_KEY=${GOOGLE_API_KEY}
        - PINECONE_API_KEY=${PINECONE_API_KEY}
        - PINECONE_ENVIRONMENT=${PINECONE_ENVIRONMENT}
        - PINECONE_INDEX=${PINECONE_INDEX}
        - REDIS_HOST=redis
        - REDIS_PORT=6379
        - REDIS_PASSWORD=${REDIS_PASSWORD:-dawn_redis_pass}
    container_name: dawn-frontend
    environment:
      NODE_ENV: production
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-a-very-secret-nextauth-secret-key}
      DATABASE_URL: postgresql://${POSTGRES_USER:-dawn_user}:${POSTGRES_PASSWORD:-dawn_password}@postgres:5432/${POSTGRES_DB:-dawn_lms}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dawn_redis_pass}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_ENVIRONMENT: ${PINECONE_ENVIRONMENT}
      PINECONE_INDEX: ${PINECONE_INDEX}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - dawn-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s

  # Nginx Reverse Proxy (for production)
  nginx:
    image: nginx:alpine
    container_name: dawn-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - dawn-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  dawn-network:
    driver: bridge 